name: Build CreamInstaller

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Publish Self-Contained (Windows x64)
      run: |
        dotnet publish --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishTrimmed=true `
          -p:EnableCompressionInSingleFile=true `
          --output ./publish/win-x64
      
    - name: Publish Self-Contained (Windows x86)
      run: |
        dotnet publish --configuration Release `
          --runtime win-x86 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishTrimmed=true `
          -p:EnableCompressionInSingleFile=true `
          --output ./publish/win-x86
      
    - name: Upload Windows x64 build
      uses: actions/upload-artifact@v4
      with:
        name: CreamInstaller-win-x64
        path: ./publish/win-x64/**/*
        if-no-files-found: error
        
    - name: Upload Windows x86 build
      uses: actions/upload-artifact@v4
      with:
        name: CreamInstaller-win-x86
        path: ./publish/win-x86/**/*
        if-no-files-found: error
